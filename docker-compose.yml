version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealprep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealprep_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mealprep}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealprep']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mealprep-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealprep-backend
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mealprep}:${POSTGRES_PASSWORD:-mealprep_secret}@postgres:5432/${POSTGRES_DB:-mealprep}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3004
      NODE_ENV: production
      CORS_ORIGIN: http://localhost,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3004/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mealprep-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mealprep-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mealprep-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mealprep-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - mealprep-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mealprep-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mealprep-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  mealprep-net:
    driver: bridge
