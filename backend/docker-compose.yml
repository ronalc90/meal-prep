version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealprep-db
    environment:
      POSTGRES_USER: mealprep
      POSTGRES_PASSWORD: mealprep_secret
      POSTGRES_DB: mealprep
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealprep']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
