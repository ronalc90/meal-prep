apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealprep-frontend
  namespace: mealprep
  labels:
    app: mealprep-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mealprep-frontend
  template:
    metadata:
      labels:
        app: mealprep-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ronalc90/meal-prep/frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      restartPolicy: Always
