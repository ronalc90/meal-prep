apiVersion: v1
kind: Service
metadata:
  name: mealprep-backend
  namespace: mealprep
  labels:
    app: mealprep-backend
spec:
  type: ClusterIP
  selector:
    app: mealprep-backend
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: mealprep-frontend
  namespace: mealprep
  labels:
    app: mealprep-frontend
spec:
  type: ClusterIP
  selector:
    app: mealprep-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
