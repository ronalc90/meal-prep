apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealprep-ingress
  namespace: mealprep
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mealprep.app
        - api.mealprep.app
      secretName: mealprep-tls
  rules:
    - host: mealprep.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealprep-frontend
                port:
                  number: 80
    - host: api.mealprep.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealprep-backend
                port:
                  number: 3004
